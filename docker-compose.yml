version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creative_marketplace_backend
    restart: always
    environment:
      - APP_NAME=${APP_NAME:-Creative Marketplace}
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=host.docker.internal
      - DB_PORT=3307
      - DB_NAME=creative_marketplace
      - DB_USER=root
      - DB_PASSWORD=password
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000,http://localhost:3001}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: creative_marketplace_frontend
    command: npm run dev
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend


